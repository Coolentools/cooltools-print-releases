# GitHub Actions-workflow: bouwt het kant-en-klaar Print Bridge SD-image met
# pi-gen en hangt het aan de release. Hoort in de PUBLIEKE release-repo
# (.github/workflows/build-sd-image.yml), samen met een kopie van de map
# pi-image/ (stage-printbridge).
#
# Gebruikt de onderhouden usimd/pi-gen-action, die de pi-gen-/Docker-/binfmt-
# (qemu-ARM-)setup correct afhandelt — handmatige binfmt-stappen zijn fragiel.
#
# Draait: handmatig (Actions → Run workflow) OF automatisch bij een nieuwe release.
name: Build SD image

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maak schijfruimte vrij
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          docker-images: false

      - name: Image bouwen (pi-gen)
        id: build
        uses: usimd/pi-gen-action@v1
        with:
          image-name: printbridge
          # Lite (stage0-2) + onze eigen stage met de eerste-boot auto-install.
          stage-list: stage0 stage1 stage2 ./pi-image/stage-printbridge
          release: bookworm
          enable-ssh: true
          username: cooltools
          password: changeme
          hostname: cooltools-print
          compression: xz
          verbose-output: true
          # locale/timezone weggelaten: de action-validatie is daar streng over en
          # ze zijn niet nodig voor een werkende image (instelbaar bij eerste boot).

      - name: Uploaden als workflow-artifact
        uses: actions/upload-artifact@v4
        with:
          name: printbridge-sd-image
          path: ${{ steps.build.outputs.image-path }}

      - name: Aan de release hangen (bij een release-trigger)
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.build.outputs.image-path }}" --clobber
